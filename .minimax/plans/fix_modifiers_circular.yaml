      4. Workaround del test eliminado:
         git show HEAD:tests/test_modifier_id_renumbering.py |
           Select-String -Pattern "importlib\.util|sys\.modules\[|spec_from_file_location"
         -> debe devolver 0 lineas.
         Ademas debe existir un import directo:
         git show HEAD:tests/test_modifier_id_renumbering.py |
           Select-String -Pattern "from core.infrastructure.xml.modifiers"
         -> debe devolver al menos 1 linea.

      5. Protocol local presente y completo:
         git show HEAD:core/infrastructure/xml/modifiers.py |
           Select-String -Pattern "class _DispositivoLike"
         -> al menos 1 linea.
         El cuerpo del Protocol debe declarar `plc_tag`, `uid` y
         `descripcion` (puedes verificarlo con un Select-String que mire
         esas 3 cadenas dentro del bloque de la clase).

      6. Validacion de tipos en add_tags:
         git show HEAD:core/infrastructure/xml/modifiers.py |
           Select-String -Pattern "isinstance\(dispositivo, _DispositivoLike\)"
         -> al menos 1 linea (TypeError si llega un objeto que no cumple
         el Protocol).

      7. Suite completa de tests:
         python -m pytest tests/ -v
         -> debe reportar EXACTAMENTE 254 tests collected y 252 passed +
         2 skipped (los 2 skip son los tests E2E contra el XML real del
         operario cuando _source/.build_cache/... no existe; ese skip
         es legitimo y previo). Si collected != 254, si passed != 252,
         o si hay cualquier failed, FAIL.

      8. Regresion en el path original del ciclo:
         python -c "from areas.alimentacion.application.use_cases.sync_dispositivos_instances import SyncDispositivosInstancesUseCase; print('OK')"
         -> debe imprimir OK sin ImportError. Si falla, FAIL.

      ## Veredicto
      - PASS: los 8 checks pasan con evidencia listada.
      - FAIL: cualquier check falla. Lista exactamente cual, que输出的
        output observaste, y por que es un FAIL.
      - PARTIAL: solo si el entorno no permite correr pytest (p.ej. falta
        el venv o algun modulo). Indica QUE check quedo sin verificar
        y POR QUE.

      NO modifiques archivos del proyecto. NO arregles el problema si lo
      encuentras: solo reporta.
    max_retries: 2
