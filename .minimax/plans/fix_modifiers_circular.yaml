version: 1
plan:
  name: "Resolver circular import en core/infrastructure/xml/modifiers.py via Protocol local"
  max_concurrency: 1
  max_consecutive_failures: 2
  max_cycles: 5
  auto_reject_retries: 1
  verifier_config:
