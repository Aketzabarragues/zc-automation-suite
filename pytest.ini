[pytest]
# ============================================================================
#  Pytest config para zc-plc-suite (greenfield IEC 61131-3)
# ============================================================================

# Requerido por pytest (en lugar del heredado setup.cfg)
minversion = 8.0

# Donde buscar tests
testpaths = tests

# Patrones de descubrimiento
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones por defecto
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short

# Markers (registrados para evitar warning de --strict-markers)
markers =
    frontend_smoke: smoke tests del frontend (contract checks sobre .js)
    integration: integration tests (TestClient de FastAPI + Engine real, worker mockeado)
    e2e: smoke E2E con S7-1500 real (NO automatizado, ver .clinerules §12)

# asyncio mode (pytest-asyncio)
asyncio_mode = auto

# Paths
rootdir = .
pythonpath = .
