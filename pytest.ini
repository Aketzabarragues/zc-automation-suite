[pytest]
# Excluir las copias de seguridad que crean ciertos editores de texto
# (Notepad++/VS Code) al detectar modificaciones externas. Se nombran
# con el sufijo " (conflicted copy YYYY-MM-DD HHMMSS).ext" y pytest las
# recoge como archivos de test adicionales, lo que provoca fallos
# espurios sin relación con el código real.
python_files = test_*.py
python_functions = test_*
# Cualquier archivo con "conflicted" en el nombre se ignora.
collect_ignore_glob =
    *conflicted*
